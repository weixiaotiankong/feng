name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Syntax check (compile all Python files)
        run: |
          if [ -n "$(find . -name '*.py' -not -path './.git/*')" ]; then
            python -m compileall -q .
          else
            echo "No Python files to compile."
          fi

      - name: Run tests
        run: |
          if [ -d tests ]; then python -m pytest -q; else echo "No tests directory."; fi
